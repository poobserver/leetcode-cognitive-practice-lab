<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>力扣认知刷题器</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f6f7fb;
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid #d8deea;
      background: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }
    main {
      display: grid;
      grid-template-columns: minmax(360px, 480px) minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      min-height: calc(100vh - 66px);
    }
    .panel {
      background: #ffffff;
      border: 1px solid #d8deea;
      border-radius: 8px;
      min-width: 0;
    }
    .input-panel {
      display: flex;
      flex-direction: column;
      min-height: 720px;
    }
    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid #d8deea;
      font-weight: 700;
    }
    .form {
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 650;
      color: #34415a;
    }
    textarea, input, select {
      width: 100%;
      border: 1px solid #c7d0df;
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
      background: #ffffff;
      color: #172033;
    }
    textarea {
      min-height: 330px;
      resize: vertical;
      line-height: 1.5;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    button {
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      font-weight: 750;
      cursor: pointer;
      background: #1f6feb;
      color: #ffffff;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .secondary {
      background: #edf2f9;
      color: #24324a;
      border: 1px solid #c7d0df;
    }
    .status {
      min-height: 44px;
      border-radius: 6px;
      padding: 10px;
      border: 1px solid #d8deea;
      background: #f8fafc;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .status.ok {
      border-color: #65a579;
      background: #eefbf1;
    }
    .status.err {
      border-color: #d66b6b;
      background: #fff1f1;
    }
    .preview-panel {
      display: flex;
      flex-direction: column;
      min-height: 720px;
      overflow: hidden;
    }
    .toolbar {
      padding: 10px 12px;
      border-bottom: 1px solid #d8deea;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }
    .links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    a {
      color: #1f6feb;
      font-size: 13px;
      text-decoration: none;
      font-weight: 650;
    }
    iframe {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 0;
      background: #ffffff;
    }
    .empty {
      display: grid;
      place-items: center;
      flex: 1;
      color: #5d6b82;
      text-align: center;
      padding: 24px;
    }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
      .input-panel, .preview-panel { min-height: 560px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>力扣认知刷题器</h1>
    <span id="runtime">本地工作流 · DeepSeek</span>
  </header>
  <main>
    <section class="panel input-panel">
      <div class="panel-head">输入题目</div>
      <div class="form">
        <label>
          题目 / 代码 / LeetCode 文本
          <textarea id="problemText" placeholder="粘贴力扣题、算法题或代码分析题。力扣题建议包含题号、题名、描述、示例、约束、函数签名。"></textarea>
        </label>
        <label>
          DeepSeek API Key
          <input id="apiKey" type="password" placeholder="可留空，后端会读取 DEEPSEEK_API_KEY 或 .env">
        </label>
        <div class="grid">
          <label>
            模型
            <input id="model" value="deepseek-v4-flash">
          </label>
          <label>
            修复次数
            <select id="attempts">
              <option value="2" selected>2</option>
              <option value="1">1</option>
              <option value="3">3</option>
            </select>
          </label>
        </div>
        <div class="grid">
          <label>
            最大 token
            <input id="maxTokens" type="number" value="384000" min="4096">
          </label>
          <label>
            温度
            <input id="temperature" type="number" value="0.25" step="0.05" min="0" max="1">
          </label>
        </div>
        <button id="generateBtn">生成学习材料</button>
        <button class="secondary" id="loadSampleBtn">填入 #209 示例</button>
        <div id="status" class="status">等待输入。</div>
      </div>
    </section>
    <section class="panel preview-panel">
      <div class="toolbar">
        <strong>生成结果</strong>
        <div class="links">
          <a id="openHtml" href="#" target="_blank" hidden>打开 HTML</a>
          <a id="openReport" href="#" target="_blank" hidden>查看报告</a>
          <a id="openJson" href="#" target="_blank" hidden>查看题目 JSON</a>
          <a id="openPlan" href="#" target="_blank" hidden>查看 page_plan</a>
        </div>
      </div>
      <div id="empty" class="empty">生成完成后，学习材料会在这里直接预览。</div>
      <iframe id="preview" title="生成的学习材料" hidden></iframe>
    </section>
  </main>
  <script>
    const sample209 = `209. Minimum Size Subarray Sum

Given an array of positive integers nums and a positive integer target, return the minimal length of a subarray whose sum is greater than or equal to target. If there is no such subarray, return 0 instead.

Example 1:
Input: target = 7, nums = [2,3,1,2,4,3]
Output: 2
Explanation: The subarray [4,3] has the minimal length under the problem constraint.

Example 2:
Input: target = 4, nums = [1,4,4]
Output: 1

Example 3:
Input: target = 11, nums = [1,1,1,1,1,1,1,1]
Output: 0

Constraints:
1 <= target <= 10^9
1 <= nums.length <= 10^5
1 <= nums[i] <= 10^4

Follow up: If you have figured out the O(n) solution, try coding another solution of which the time complexity is O(n log(n)).

Function signature:
def minSubArrayLen(self, target: int, nums: List[int]) -> int:`;

    const statusEl = document.getElementById("status");
    const button = document.getElementById("generateBtn");
    const preview = document.getElementById("preview");
    const empty = document.getElementById("empty");
    const openHtml = document.getElementById("openHtml");
    const openReport = document.getElementById("openReport");
    const openJson = document.getElementById("openJson");
    const openPlan = document.getElementById("openPlan");

    document.getElementById("loadSampleBtn").addEventListener("click", () => {
      document.getElementById("problemText").value = sample209;
    });

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    function setLink(anchor, url) {
      anchor.href = url;
      anchor.hidden = false;
    }

    button.addEventListener("click", async () => {
      const problemText = document.getElementById("problemText").value.trim();
      if (!problemText) {
        setStatus("请先粘贴题目文本。", "err");
        return;
      }
      button.disabled = true;
      setStatus("生成中：正在结构化题目，然后请求 DeepSeek 生成完整 HTML。这个过程可能需要 1-3 分钟。");
      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            problemText,
            apiKey: document.getElementById("apiKey").value.trim(),
            model: document.getElementById("model").value.trim(),
            maxTokens: Number(document.getElementById("maxTokens").value),
            temperature: Number(document.getElementById("temperature").value),
            attempts: Number(document.getElementById("attempts").value)
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) {
          const errors = data.auditErrors && data.auditErrors.length ? "\n" + data.auditErrors.join("\n") : "";
          throw new Error((data.error || "生成未通过审计") + errors);
        }
        preview.src = data.htmlUrl;
        preview.hidden = false;
        empty.hidden = true;
        setLink(openHtml, data.htmlUrl);
        setLink(openReport, data.reportUrl);
        setLink(openJson, data.problemJsonUrl);
        setLink(openPlan, data.pagePlanUrl);
        const usage = data.report.usage || [];
        const planUsage = data.report.pagePlanUsage || [];
        const last = usage[usage.length - 1] || {};
        const lastPlan = planUsage[planUsage.length - 1] || {};
        setStatus(`生成完成。\n模型：${data.report.model}\npage_plan_tokens：${lastPlan.completion_tokens || "unknown"}\nHTML 尝试次数：${data.report.attempts}\nHTML completion_tokens：${last.completion_tokens || "unknown"}`, "ok");
      } catch (error) {
        setStatus(String(error.message || error), "err");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
